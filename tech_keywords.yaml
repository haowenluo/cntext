# Usage notes:
#
# These keywords are designed to capture technology-related discussions in 10-K filings.
# They include:
#   - Multi-word phrases (e.g., "artificial intelligence")
#   - Common abbreviations (e.g., "ai", "nlp", "rpa")
#   - Product names (e.g., "aws", "azure")
#   - Technology categories (e.g., "cloud computing", "blockchain")
#
# The matching is case-insensitive and uses word boundaries to avoid partial matches.
#
# You can customize this file by:
#   1. Adding industry-specific terms
#   2. Removing overly broad terms that cause false positives
#   3. Adding company-specific technology names
#   4. Creating subcategories for finer-grained classification
#
# Example customization:
#
# Dictionary:
#   industry_specific:
#     - healthcare_tech:
#       - telemedicine
#       - electronic health record
#       - medical imaging
#     - automotive_tech:
#       - electric vehicle
#       - battery technology
#       - autonomous driving
